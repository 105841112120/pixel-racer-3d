name: Build EXE from Zip

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Zip File
        run: |
          unzip -q "*.zip" -d ./extracted

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clean, Install & Build EXE
        run: |
          # Cari folder package.json utama
          PKG_PATH=$(find ./extracted -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$PKG_PATH" ]; then
            echo "package.json tidak ditemukan!"
            exit 1
          fi
          
          TARGET_DIR=$(dirname "$PKG_PATH")
          echo "Masuk ke folder proyek utama: $TARGET_DIR"
          cd "$TARGET_DIR"

          # Hapus node_modules bawaan zip jika ada
          rm -rf node_modules

          # Install dependencies bersih
          npm install --legacy-peer-deps

          # Build project web Vite/React terlebih dahulu
          npm run build --if-present

          # Build file .exe Windows lewat Linux
          npx electron-builder --win nsis --x64

      - name: Upload Artifact (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-Racer-3D-EXE
          path: "./extracted/**/dist-electron/*.exe"
