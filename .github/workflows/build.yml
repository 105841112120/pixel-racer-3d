name: Build EXE from Zip

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Zip File
        run: |
          Expand-Archive -Path "*.zip" -DestinationPath "./extracted"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clean, Install & Build
        run: |
          # Cari folder package.json utama
          $pkg = Get-ChildItem -Path ./extracted -Filter "package.json" -Recurse | Where-Object { $_.FullName -notlike "*node_modules*" } | Select-Object -First 1
          if (-not $pkg) { throw "package.json utama tidak ditemukan!" }
          
          $dir = $pkg.DirectoryName
          Write-Host "Masuk ke folder proyek utama: $dir"
          Set-Location $dir

          # Hapus node_modules bawaan zip jika ada agar tidak crash/bentrok
          if (Test-Path "node_modules") {
            Remove-Item -Recurse -Force "node_modules"
          }

          # Install ulang dependencies bersih
          npm install --legacy-peer-deps

          # Build project Vite/React terlebih dahulu
          npm run build --if-present

          # Build executable Electron
          npm run electron:build

      - name: Upload Artifact (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-Racer-3D-EXE
          path: "./extracted/**/dist-electron/*.exe"
